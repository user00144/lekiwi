[project]
name = "harness"
version = "0.1.0"
description = "Lekiwi MCP tools for Codex"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyzmq>=27.1",
    "mcp>=1.26,<2",
    "openai-codex>=0.167.0",
]

[project.scripts]
harness = "harness:main"
harness-run = "harness.runtime:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
