[project]
name = "harness"
version = "0.1.0"
description = "Lekiwi MCP tools for Codex"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pyzmq>=27.1",
    "mcp>=1.26,<2",
    "openai-codex>=0.167.0",
    "starlette>=0.49,<2",
    "uvicorn>=0.31,<1",
    "numpy>=2,<3",
    "scipy>=1.15,<2",
    "pin>=4.1,<5",
    "osqp>=1.1.3,<2",
]

[project.scripts]
harness = "harness:main"
harness-run = "harness.runtime:main"
harness-gui = "harness.gui:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
