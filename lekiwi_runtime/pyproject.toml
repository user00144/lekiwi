[project]
name = "lekiwi-runtime"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pyzmq>=27.1",
    "numpy>=1.24",
    "opencv-python-headless>=4.8",
    "pyserial>=3.5",
    "feetech-servo-sdk>=1.0.0",
]

[project.scripts]
lekiwi-runtime = "lekiwi_runtime:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
]
